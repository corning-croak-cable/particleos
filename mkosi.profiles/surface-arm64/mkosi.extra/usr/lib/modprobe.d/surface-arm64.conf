# Module options for Snapdragon X Elite (Surface Laptop 7)

# Force CRB interface for Qualcomm fTPM.
# X Elite fTPM registers as a CRB device; tpm_tis/tpm_tis_spi conflict with it.
# Source: TCG TPM PC Client Firmware Profile specification
blacklist tpm_tis
blacklist tpm_tis_spi
options tpm_crb force_locality=0

# No PC speaker hardware on Snapdragon
blacklist pcspkr
blacklist snd_pcsp

# Increase QRTR socket buffer for Qualcomm subsystem IPC
options qrtr recv_buf_size=131072
