# Surface Laptop 7 / Snapdragon X Elite (arm64) profile
# Activate with: mkosi --profile surface-arm64
#
# TPM/Secure Boot design notes:
#  - SignExpectedPcr=no: Qualcomm fTPM unavailable during initrd PCR measurements.
#    Disabling avoids boot-time hang. Source: linux-surface/issues/1590
#  - NX Mode quirk: Surface UEFI NX Mode breaks MokManager. Profile uses
#    UKI + systemd-boot (no shim). Enrollment via sbctl + direct UEFI db.
#  - Upstream kernel only - bootability over full hardware support.

[Match]
Profile=surface-arm64

[Distribution]
Architecture=arm64

[Validation]
# Inherit SecureBoot=yes from root; override PCR signing (Qualcomm fTPM quirk).
SignExpectedPcr=no

[Content]
Packages=
        qrtr
        pd-mapper
        linux-firmware
        tpm2-tools
        tpm2-tss
        sbctl
        efivar
        efitools

# Snapdragon X Elite kernel command line
# clk_ignore_unused/pd_ignore_unused prevent clock/power-domain framework from
# disabling unattached clocks during init - critical on Qualcomm bringup.
# Source: Linaro Snapdragon X Elite bring-up documentation
KernelCommandLine=
        clk_ignore_unused
        pd_ignore_unused

# DRM, HID, and TPM CRB modules needed in initrd
KernelInitrdModules=/drivers/gpu/drm
                    /drivers/hid/hid-multitouch.ko
                    /drivers/hid/hid-generic.ko
                    /drivers/tpm/tpm_crb.ko
